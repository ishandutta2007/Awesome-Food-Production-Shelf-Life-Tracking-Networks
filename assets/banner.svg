<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526" />
      <stop offset="50%" stop-color="#0b2438" />
      <stop offset="100%" stop-color="#050e18" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EFA8A" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b3e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#091b28" stop-opacity="0.9" />
    </linearGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
      }
      .telemetry-flow {
        stroke-dasharray: 12 14;
        animation: flowDash 14s linear infinite;
      }
      .telemetry-flow-slow {
        stroke-dasharray: 8 16;
        animation: flowDash 22s linear infinite;
      }
      .pulse-beacon {
        animation: beaconGlow 2.8s ease-in-out infinite alternate;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes beaconGlow {
        0% { opacity: 0.35; }
        50% { opacity: 0.95; }
        100% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- DYNAMIC / ANIMATED BACKGROUND TELEMETRY WAVES & SENSOR LATTICE -->
  <g opacity="0.4">
    <!-- Grid System -->
    <path d="M 0,90 L 1200,90 M 0,180 L 1200,180 M 0,270 L 1200,270" stroke="#163852" stroke-width="1" stroke-dasharray="4 6" />
    <path d="M 200,0 L 200,360 M 450,0 L 450,360 M 700,0 L 700,360 M 950,0 L 950,360" stroke="#163852" stroke-width="1" stroke-dasharray="4 6" />

    <!-- Flowing Telemetry Streams (SMIL + CSS Animation fallback) -->
    <path class="telemetry-flow" d="M -50,110 Q 250,40 550,120 T 1150,80 T 1300,120" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-400" dur="14s" repeatCount="indefinite" />
    </path>
    <path class="telemetry-flow-slow" d="M -50,250 Q 300,310 650,230 T 1150,270 T 1300,240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="-400" dur="22s" repeatCount="indefinite" />
    </path>
    <path class="telemetry-flow" d="M -50,190 Q 200,150 500,200 T 1050,170 T 1300,200" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.45">
      <animate attributeName="stroke-dashoffset" from="0" to="-400" dur="18s" repeatCount="indefinite" />
    </path>

    <!-- Pulsating IoT Sensor Nodes with SMIL fallback for full SVG viewer support -->
    <circle cx="160" cy="115" r="5" fill="#4efa8a" class="pulse-beacon">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="390" cy="85" r="5.5" fill="#38bdf8" class="pulse-beacon">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;7;4" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="95" r="5" fill="#a78bfa" class="pulse-beacon">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;6;3.5" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="120" r="6" fill="#4efa8a" class="pulse-beacon">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6.5;4" dur="2.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="270" r="5" fill="#38bdf8" class="pulse-beacon">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6;4" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="255" r="6" fill="#4efa8a" class="pulse-beacon">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;7;4" dur="2.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="245" r="5" fill="#38bdf8" class="pulse-beacon">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;6.5;3.5" dur="2.3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND LAYER: Content stays clear, sharp, and unobstructed -->
  <g id="foreground">
    <!-- Top Taxonomy Tag -->
    <g transform="translate(64, 46)">
      <rect width="320" height="28" rx="14" fill="#0c2333" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#4EFA8A" />
      <text x="28" y="18" fill="#a5f3fc" class="badge-label">COLD CHAIN • FEFO • TELEMETRY NETWORKS</text>
    </g>

    <!-- Main Title -->
    <text x="64" y="126" fill="url(#titleGrad)" font-size="37" class="title-text">Awesome Food Production</text>
    <text x="64" y="170" fill="#FFFFFF" font-size="32" class="title-text">&amp; Shelf-Life Tracking Networks</text>

    <!-- Subtitle / Mission -->
    <text x="64" y="210" fill="#94A3B8" font-size="15" class="subtitle-text">Curated directory of SaaS platforms, IoT cold-chain telemetry, computer-vision freshness grading,</text>
    <text x="64" y="233" fill="#94A3B8" font-size="15" class="subtitle-text">and predictive shelf-life engines powering zero-waste perishable supply chains.</text>

    <!-- Key Architectural Pillars / Badges in Foreground -->
    <g transform="translate(64, 268)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="url(#cardGrad)" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.2" />
        <circle cx="18" cy="18" r="6" fill="#22c55e" />
        <text x="32" y="22" fill="#bbf7d0" class="badge-label">IoT Cold Telemetry</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(196, 0)">
        <rect width="180" height="36" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
        <circle cx="18" cy="18" r="6" fill="#38bdf8" />
        <text x="32" y="22" fill="#bae6fd" class="badge-label">FEFO Dynamic Route</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(392, 0)">
        <rect width="190" height="36" rx="8" fill="url(#cardGrad)" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.2" />
        <circle cx="18" cy="18" r="6" fill="#a78bfa" />
        <text x="32" y="22" fill="#ddd6fe" class="badge-label">AI Spoilage Modeling</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(598, 0)">
        <rect width="180" height="36" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.2" />
        <circle cx="18" cy="18" r="6" fill="#f59e0b" />
        <text x="32" y="22" fill="#fef3c7" class="badge-label">FSMA 204 &amp; EPCIS</text>
      </g>
    </g>

    <!-- Illustrative Cold-Chain Freshness Emblem on Right -->
    <g transform="translate(980, 105)">
      <!-- Outer Tech Container -->
      <rect x="0" y="0" width="144" height="144" rx="24" fill="#09202f" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45" />
      <!-- Concentric Cold Rings -->
      <circle cx="72" cy="72" r="46" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8" />
      <circle cx="72" cy="72" r="32" fill="#0d2b3e" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Fresh Leaf Symbol -->
      <path d="M 72,50 C 60,60 60,82 72,92 C 84,82 84,60 72,50 Z" fill="#4EFA8A" />
      <path d="M 72,60 L 72,86" stroke="#064e3b" stroke-width="2" stroke-linecap="round" />
      <!-- Signal Telemetry Waves -->
      <path d="M 58,36 A 24 24 0 0 1 86 36" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 48,26 A 38 38 0 0 1 96 26" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.65" />
    </g>
  </g>
</svg>
