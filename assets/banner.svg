<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0d2b3a" />
      <stop offset="100%" stop-color="#081420" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EFA8A" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .sensor-pulse {
        animation: pulseWave 3s infinite ease-in-out;
      }
      .node-glow {
        animation: nodeBlink 2.5s infinite alternate ease-in-out;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 20s linear infinite;
      }
      .telemetry-float {
        animation: floatY 4s ease-in-out infinite alternate;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes nodeBlink {
        0% { opacity: 0.35; r: 4px; }
        100% { opacity: 0.95; r: 7px; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes floatY {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes pulseWave {
        0% { transform: scale(0.96); opacity: 0.4; }
        50% { transform: scale(1.02); opacity: 0.85; }
        100% { transform: scale(0.96); opacity: 0.4; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS -->
  <g opacity="0.45">
    <!-- Grid Lattice Lines -->
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
    <path d="M 150,0 L 150,360 M 350,0 L 350,360 M 600,0 L 600,360 M 850,0 L 850,360 M 1050,0 L 1050,360" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 6" opacity="0.3" />

    <!-- Animated Data Waves / Flow -->
    <path class="flow-line" d="M 0,120 Q 250,50 500,110 T 1000,90 T 1200,130" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6" />
    <path class="flow-line" d="M 0,260 Q 300,320 650,250 T 1100,280 T 1200,240" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.55" />
    <path class="flow-line" d="M 0,200 Q 200,170 450,220 T 900,190 T 1200,210" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />

    <!-- Cold Chain Nodes (Sensors & Loggers) -->
    <circle cx="120" cy="120" r="5" fill="#4efa8a" class="node-glow" />
    <circle cx="380" cy="90" r="6" fill="#38bdf8" class="node-glow" style="animation-delay: 0.6s;" />
    <circle cx="720" cy="100" r="5" fill="#818cf8" class="node-glow" style="animation-delay: 1.2s;" />
    <circle cx="1020" cy="110" r="6" fill="#4efa8a" class="node-glow" style="animation-delay: 1.8s;" />
    <circle cx="240" cy="280" r="5" fill="#38bdf8" class="node-glow" style="animation-delay: 0.9s;" />
    <circle cx="820" cy="270" r="6" fill="#4efa8a" class="node-glow" style="animation-delay: 1.5s;" />
    <circle cx="1110" cy="250" r="5" fill="#38bdf8" class="node-glow" style="animation-delay: 0.3s;" />

    <!-- Ambient Cold Glow Blobs -->
    <circle cx="980" cy="180" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
    <circle cx="220" cy="180" r="120" fill="#22c55e" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND / HERO CONTENT (Never obscured) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <g transform="translate(60, 48)">
      <rect width="320" height="28" rx="14" fill="#0f2b3e" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#4EFA8A" />
      <text x="28" y="18" fill="#a5f3fc" class="badge-text">COLD CHAIN &bull; FEFO &bull; FRESHNESS TELEMETRY</text>
    </g>

    <!-- Main Repository Title -->
    <text x="60" y="128" fill="url(#titleGrad)" font-size="38" class="title-text" filter="url(#glow)">
      Awesome Food Production
    </text>
    <text x="60" y="174" fill="#FFFFFF" font-size="34" class="title-text">
      &amp; Shelf-Life Tracking Networks
    </text>

    <!-- Subtitle & Value Proposition -->
    <text x="60" y="214" fill="#94A3B8" font-size="16" class="subtitle-text">
      Curated directory of SaaS ecosystems, IoT cold chain loggers, computer vision freshness grading,
    </text>
    <text x="60" y="238" fill="#94A3B8" font-size="16" class="subtitle-text">
      and predictive shelf-life engines powering zero-waste perishable supply chains.
    </text>

    <!-- Feature Highlights / Status Pills in Foreground -->
    <g transform="translate(60, 274)">
      <!-- Pill 1: IoT Sensors -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#0b2234" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1" />
        <text x="14" y="21" fill="#86efac" class="badge-text">&#x2744;&#xFE0F; IoT Cold Telemetry</text>
      </g>
      <!-- Pill 2: FEFO Routing -->
      <g transform="translate(196, 0)">
        <rect width="180" height="34" rx="8" fill="#0b2234" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
        <text x="14" y="21" fill="#7dd3fc" class="badge-text">&#x1F69A; FEFO Dynamic Route</text>
      </g>
      <!-- Pill 3: Spoilage Prediction -->
      <g transform="translate(392, 0)">
        <rect width="190" height="34" rx="8" fill="#0b2234" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1" />
        <text x="14" y="21" fill="#c7d2fe" class="badge-text">&#x1F96C; AI Spoilage Modeling</text>
      </g>
      <!-- Pill 4: GS1 / EPCIS Standards -->
      <g transform="translate(598, 0)">
        <rect width="180" height="34" rx="8" fill="#0b2234" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1" />
        <text x="14" y="21" fill="#fde68a" class="badge-text">&#x1F4CB; FSMA 204 &amp; EPCIS</text>
      </g>
    </g>

    <!-- Visual Decorative Tech Icon on Right -->
    <g transform="translate(980, 110)" class="telemetry-float">
      <!-- Shield/Core container -->
      <rect x="0" y="0" width="150" height="150" rx="24" fill="#0a2335" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
      <circle cx="75" cy="75" r="45" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="6 6" />
      <circle cx="75" cy="75" r="30" fill="#0f374d" stroke="#38bdf8" stroke-width="2" />
      <!-- Fresh Leaf & Sensor Motif -->
      <path d="M 75,55 C 62,65 62,85 75,95 C 88,85 88,65 75,55 Z" fill="#4EFA8A" />
      <path d="M 75,65 L 75,90" stroke="#064e3b" stroke-width="2" stroke-linecap="round" />
      <!-- Radiating telemetry signal arcs -->
      <path d="M 60,40 A 25 25 0 0 1 90 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <path d="M 50,30 A 40 40 0 0 1 100 30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    </g>
  </g>
</svg>
